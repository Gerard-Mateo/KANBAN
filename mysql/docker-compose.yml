# MySQL local para el Kanban. Arranca con `npm run db:up`.
# Puerto 3307 en el host para no chocar con un MySQL que ya tengas instalado.
services:
  mysql:
    image: mysql:8.4
    container_name: kanban-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kanban
      MYSQL_DATABASE: kanban
      MYSQL_USER: kanban
      MYSQL_PASSWORD: kanban
    ports:
      - "3307:3306"
    volumes:
      - kanban-mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro

volumes:
  kanban-mysql-data:
